[workspace]
resolver = "2"
members = ["crates/flocking-core", "crates/flocking-nostr"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.90"
repository = "https://github.com/andersaamodt/flocking"

[workspace.dependencies]
flocking-core = { path = "crates/flocking-core" }
nostr = "0.44.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
